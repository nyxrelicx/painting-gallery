name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, from github actions!"
      - name: Get the Code
        uses: actions/checkout@v7
      - name: List the files
        run: ls 
      - name: Check the home page has a heading
        run: grep "<h1>" index.html