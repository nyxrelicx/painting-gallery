<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyxrelicx | art corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- cinema bars that open at the start -->
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="ig"><a href="https://www.instagram.com/nyxrelicx/" target="_blank" rel="noopener">@nyxrelicx on instagram</a></div>

  <main>
    <h1>nyxrelicx</h1>
    <p class="tag">Hello, I don't really know what I'm doing but I try</p>

    <div class="shelf">
      <button class="polaroid" aria-label="Open painting 1"><img data-n="1" alt="Painting 1"></button>
      <button class="polaroid" aria-label="Open painting 2"><img data-n="2" alt="Painting 2"></button>
      <button class="polaroid" aria-label="Open painting 3"><img data-n="3" alt="Painting 3"></button>
      <button class="polaroid" aria-label="Open painting 5"><img data-n="5" alt="Painting 5"></button>
      <button class="polaroid" aria-label="Open painting 6"><img data-n="6" alt="Painting 6"></button>
    </div>

    <p class="hint">click a painting to step inside</p>
  </main>

  <!-- Gallery theater: one painting at a time, click to reveal the next -->
  <dialog id="theater" aria-label="Gallery">
    <button class="x" aria-label="Close">&times;</button>
    <div id="stage">
      <div id="card" class="card" hidden>
        <h2>the end</h2>
        <p>click to watch again</p>
      </div>
      <figure id="frame" hidden>
        <img id="big" alt="">
        <figcaption id="cap"></figcaption>
      </figure>
    </div>
    <button class="nav prev" aria-label="Previous painting">&#8249;</button>
    <button class="nav next" aria-label="Next painting">&#8250;</button>
    <div id="progress"><i></i></div>
    <div id="count" aria-live="polite"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
