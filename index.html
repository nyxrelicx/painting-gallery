<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyxrelicx | art corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>nyxrelicx</h1>
    <p class="sub">my little art corner &#9825;</p>

    <div class="shelf">
      <button class="polaroid"><img data-n="1" alt="Painting 1"></button>
      <button class="polaroid"><img data-n="2" alt="Painting 2"></button>
      <button class="polaroid"><img data-n="3" alt="Painting 3"></button>
      <button class="polaroid"><img data-n="5" alt="Painting 5"></button>
      <button class="polaroid"><img data-n="6" alt="Painting 6"></button>
    </div>

    <div class="menu">
      <button class="pill pink" data-open="about">about me</button>
      <button class="pill lilac" id="openGallery">gallery</button>
      <a class="pill mint" href="https://www.instagram.com/nyxrelicx/" target="_blank" rel="noopener">instagram</a>
    </div>
  </main>

  <!-- About popup -->
  <dialog id="about" class="popup">
    <div class="inner">
      <button class="x" aria-label="Close">&times;</button>
      <h2>about me &#10047;</h2>
      <p>Hi! I'm nyxrelicx. I paint (write what you paint here!).</p>
      <p>Write two or three sentences about yourself here. Edit them in <code>index.html</code>.</p>
      <a class="pill mint" href="https://www.instagram.com/nyxrelicx/" target="_blank" rel="noopener">follow me on instagram</a>
    </div>
  </dialog>

  <!-- Gallery theater: one painting at a time, click to reveal the next -->
  <dialog id="theater" aria-label="Gallery">
    <button class="x" aria-label="Close">&times;</button>
    <div id="stage">
      <div id="card" class="card">
        <h2>gallery &#10024;</h2>
        <p>click to begin</p>
      </div>
      <figure id="frame" hidden>
        <img id="big" alt="">
        <figcaption id="cap"></figcaption>
      </figure>
    </div>
    <button class="nav prev" aria-label="Previous painting">&#8249;</button>
    <button class="nav next" aria-label="Next painting">&#8250;</button>
    <div id="count" aria-live="polite"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
